<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>melon</title><style>
:root{color-scheme:dark;font:12px -apple-system,BlinkMacSystemFont,sans-serif;color:#dedede}
body{margin:12px 14px}main{display:grid;gap:9px}label{display:grid;grid-template-columns:88px 1fr;align-items:center;gap:8px}
input,select,textarea,button{background:#373737;color:#fff;border:1px solid #515151;border-radius:4px;padding:6px;box-sizing:border-box;min-width:0;font:inherit}
textarea{height:76px}input[type=checkbox]{justify-self:start}p{margin:5px 0;color:#bababa;line-height:1.6}
button{cursor:pointer}button:focus,input:focus,select:focus,textarea:focus{outline:2px solid #a8f763}#result{color:#b9efa1}
</style></head><body><main id="fields"></main><p id="help"></p><button id="check">멜론 연결 확인</button><p role="status" id="result"></p><script src="inspector.js"></script></body></html>
