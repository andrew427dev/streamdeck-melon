name: macOS 플러그인 검증
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: 설치 파일과 Universal 실행 파일 검사
        run: |
          unzip -tq local.melon.deck.streamDeckPlugin
          architectures=$(lipo -archs local.melon.deck.sdPlugin/bin/MelonBridge)
          for arch in arm64 x86_64; do
            grep -qw "$arch" <<< "$architectures"
          done
          codesign --verify --strict local.melon.deck.sdPlugin/bin/MelonBridge
          shasum -a 256 local.melon.deck.streamDeckPlugin > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: streamdeck-melon-macos
          path: |
            local.melon.deck.streamDeckPlugin
            SHA256SUMS.txt
          if-no-files-found: error
